[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flow-story-studio"
version = "1.8.3"
description = "TH Media - AI story production and continuity-first text-to-video pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "pydantic>=2.8,<3.0",
  "platformdirs>=4.0,<5.0",
  "pywebview>=5.4,<7.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0,<7.0",
  "ruff>=0.6",
  "httpx2>=2.12,<3.0",
  "playwright>=1.55,<2.0",
  "pip-audit>=2.7,<3.0",
  "bandit>=1.7,<2.0",
  "pip-licenses>=5.0,<6.0",
]
build = ["pyinstaller>=6.10,<7.0"]

[project.scripts]
th-media = "flow_story_studio.main:run"
th-media-desktop = "flow_story_studio.desktop:run_desktop"
flow-story-studio = "flow_story_studio.main:run"
flow-story-studio-desktop = "flow_story_studio.desktop:run_desktop"

[tool.hatch.build.targets.wheel]
packages = ["src/flow_story_studio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["flow_story_studio"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 70

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
